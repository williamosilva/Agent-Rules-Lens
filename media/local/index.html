<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="arl-token" content="{{token}}" />
    <title>Agent Rules Lens</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link href="/assets/rules.css" rel="stylesheet" />
    <link href="/assets/local.css" rel="stylesheet" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="topbar-row">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1 class="brand-name">Agent Rules Lens</h1>
          <span class="badge" id="mode-label"></span>
          <div class="topbar-lang" id="language"></div>
        </div>
        <p class="brand-meta">
          <span class="meta-label" id="workspace-label"></span>
          <span id="workspace" class="workspace"></span>
        </p>
        <p class="privacy" id="privacy"></p>
      </header>

      <main class="layout">
        <section class="panel picker" aria-labelledby="picker-title">
          <h2 class="panel-title" id="picker-title"></h2>

          <div class="field">
            <label class="field-label" for="file-input" id="file-label"></label>
            <div class="combo">
              <input
                type="text"
                id="file-input"
                class="field-input"
                role="combobox"
                aria-expanded="false"
                aria-controls="suggestions"
                aria-autocomplete="list"
                aria-describedby="status"
                autocomplete="off"
                spellcheck="false"
              />
              <ul class="suggestions" id="suggestions" role="listbox" hidden></ul>
            </div>
          </div>

          <div class="actions">
            <button type="button" class="button is-primary" id="analyze" disabled></button>
            <button type="button" class="button" id="refresh"></button>
          </div>

          <p class="status" id="status" role="status" aria-live="polite"></p>
          <p class="detected" id="detected"></p>
        </section>

        <section class="panel analysis" aria-labelledby="analysis-title">
          <h2 class="panel-title" id="analysis-title"></h2>
          <div class="analysis-body">
            <div class="empty-state" id="empty-state">
              <p class="empty-state-title" id="empty-title"></p>
              <p class="empty-state-body" id="empty-body"></p>
            </div>
            <div id="root"></div>
          </div>
        </section>
      </main>

      <section class="panel preview" id="preview" hidden aria-labelledby="preview-title">
        <div class="preview-bar">
          <h2 class="panel-title" id="preview-title"></h2>
          <span class="preview-path" id="preview-path"></span>
          <span class="preview-line" id="preview-line"></span>
          <button type="button" class="button" id="preview-copy"></button>
          <button type="button" class="button" id="preview-close"></button>
        </div>
        <pre class="preview-body"><code id="preview-body"></code></pre>
      </section>
    </div>

    <script src="/assets/rulesRenderer.js"></script>
    <script src="/assets/local.js"></script>
  </body>
</html>
